<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kino</title>

<link rel="stylesheet" href="2style.css">

<style>
/* ================= GLOBAL ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

:root{
  --gold:#FFD700;
  --bg:#000;
  --card:#0f0f0f;
}

body{
  background:var(--bg);
  color:#fff;
}

/* ================= HEADER ================= */
.header{
  padding:16px;
  font-size:20px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,215,0,0.2);
}

.header::before{
  content:"👑";
}

/* ================= CONTAINER ================= */
.container{
  padding:15px;
}

/* ================= PLAYER ================= */
#playerContainer{
  width:100%;
  height:56vw;
  background:#000;
  border-radius:16px;
  overflow:hidden;
  position:relative;
  box-shadow:0 0 30px rgba(255,215,0,0.15);
}

#playerContainer iframe,
#playerContainer video{
  width:100%;
  height:100%;
}

/* ================= DOWNLOAD ================= */
#downloadBtn{
  display:block;
  text-align:center;
  padding:12px;
  background:linear-gradient(135deg,#FFD700,#FFC300);
  color:#000;
  border-radius:12px;
  text-decoration:none;
  font-weight:700;
  margin:15px 0;
  transition:.3s;
}

#downloadBtn:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px rgba(255,215,0,0.5);
}

/* ================= EPISODES GRID ================= */
#episodes{
  display:grid;
  grid-template-columns: repeat(5, 1fr);
  gap:10px;
  margin-bottom:15px;
}

#episodes button{
  width:100%;
  padding:10px 0;
  border-radius:10px;
  background:#111;
  color:#fff;
  border:1px solid rgba(255,255,255,0.1);
  cursor:pointer;
  transition:.3s;
}

#episodes button:hover{
  border:1px solid var(--gold);
}

#episodes .active{
  background:var(--gold);
  color:#000;
  box-shadow:0 0 10px rgba(255,215,0,0.5);
}

/* ================= INFO ================= */
#genre{
  color:#aaa;
  margin:8px 0;
}

#desc{
  font-size:14px;
  color:#ddd;
  line-height:1.6;
}

/* ================= ACTORS ================= */
.actor-row{
  display:flex;
  gap:14px;
  overflow-x:auto;
  margin:15px 0;
}

.actor-item{
  text-align:center;
  min-width:80px;
  cursor:pointer;
}

.actor-item img{
  width:80px;
  height:80px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid transparent;
  transition:.3s;
}

.actor-item:hover img{
  border:2px solid var(--gold);
  box-shadow:0 0 10px rgba(255,215,0,0.5);
}

/* ================= IMAGES ================= */
.images{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.images img{
  width:100%;
  aspect-ratio:2/1;
  object-fit:cover;
  border-radius:14px;
  cursor:pointer;
  transition:.3s;
}

.images img:hover{
  transform:scale(1.05);
  box-shadow:0 0 15px rgba(255,215,0,0.3);
}

/* ================= PREMIUM BOX ================= */
#premiumBox{
  display:none;
  background:#111;
  border:1px solid var(--gold);
  padding:15px;
  border-radius:12px;
  text-align:center;
}

#premiumBox a{
  display:inline-block;
  margin-top:10px;
  padding:10px 15px;
  background:var(--gold);
  color:#000;
  border-radius:10px;
  text-decoration:none;
  font-weight:600;
}

/* ================= MODAL ================= */
#imageModal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
}

#imageModal img{
  max-width:90%;
  max-height:90%;
  border-radius:12px;
}
/* ================= MOBILE ================= */
@media (max-width:768px){
  #episodes{
    grid-template-columns: repeat(4, 1fr);
  }
}

@media (max-width:480px){
  #episodes{
    grid-template-columns: repeat(3, 1fr);
  }
}

</style>
</head>

<body>

<div class="header" id="movieTitle">Kino</div>

<div class="container">

<div id="playerContainer"></div>
<a id="downloadBtn" href="#" download>
  ⬇ Yuklab olish
</a>
<div id="premiumBox">
  <h3>Telegram kontent</h3>
  <p>Bu film mualliflik huquqi sabab telegramga ko'chirildi</p>
  <a href="https://t.me/c/3774058383/36" target="_blank">Telegram da ko'rish</a>
</div>

<div id="episodes"></div>

<h3 id="genre"></h3>
<p id="desc"></p>

<h3>👤 Aktyorlar</h3>
<div id="actors" class="actor-row"></div>

<h3>🖼 Rasmlar</h3>
<div id="images" class="images"></div>

</div>

<script src="data.js"></script>

<script>
const TMDB_API_KEY="c86f82502e750953b61a3fc9895c95a2";

const params=new URLSearchParams(window.location.search);
const id=params.get("id");
const movie=moviesData[id];

const playerContainer=document.getElementById("playerContainer");
const downloadBtn = document.getElementById("downloadBtn");
const episodesDiv=document.getElementById("episodes");
const title=document.getElementById("movieTitle");
const genre=document.getElementById("genre");
const desc=document.getElementById("desc");
const actorsDiv=document.getElementById("actors");
const imagesDiv=document.getElementById("images");
const premiumBox=document.getElementById("premiumBox");

/* VIDEO */
function loadVideo(url){
  playerContainer.innerHTML="";

  // PREMIUM
  if(url==="premium"){
    premiumBox.style.display="block";
    downloadBtn.style.display="none";
    return;
  }

  premiumBox.style.display="none";

  // 🎬 MP4 bo‘lsa
  if(url.endsWith(".mp4")){
    downloadBtn.style.display="block";
    downloadBtn.href=url;
    downloadBtn.textContent="⬇ Yuklab olish";
    downloadBtn.removeAttribute("target");

    const video = document.createElement("video");
    video.src = url;
    video.controls = true;
    video.autoplay = false; // ⬅ autoplay o'chirildi
    video.style.width = "100%";
    video.style.height = "100%";

    playerContainer.appendChild(video);
  }

  // 🚫 YouTube yoki VK bo‘lsa — tugma YO‘Q
  else if(
    url.includes("youtube.com") ||
    url.includes("youtu.be") ||
    url.includes("vk.com")
  ){
    downloadBtn.style.display="none";

    const iframe = document.createElement("iframe");
    iframe.src = url;
    iframe.allow = "autoplay; fullscreen";
    iframe.style.width = "100%";
    iframe.style.height = "100%";
    playerContainer.appendChild(iframe);
  }

  // 🔁 boshqa iframe bo‘lsa
  else{
    downloadBtn.style.display="none";

    const iframe = document.createElement("iframe");
    iframe.src = url;
    iframe.allow = "autoplay; fullscreen";
    iframe.style.width = "100%";
    iframe.style.height = "100%";
    playerContainer.appendChild(iframe);
  }
}
/* EPISODES (faqat serial) */
function renderEpisodes(){
  episodesDiv.innerHTML="";

  if(!movie.video || movie.video.length<=1){
    episodesDiv.style.display="none";
    return;
  }

  episodesDiv.style.display="grid";

  movie.video.forEach((v,i)=>{
    const btn=document.createElement("button");
    btn.textContent=`${i+1}-qism`;

    if(i===0) btn.classList.add("active");

    btn.onclick=()=>{
      document.querySelectorAll("#episodes button")
        .forEach(b=>b.classList.remove("active"));

      btn.classList.add("active");
      loadVideo(v);
    };

    episodesDiv.appendChild(btn);
  });
}

/* ACTORS */
async function renderActors(){
  actorsDiv.innerHTML="";

  for(const a of movie.actors){
    let name=a.name||"";
    let img=a.img||"";

    if(a.tmdbId){
      try{
        const res=await fetch(`https://api.themoviedb.org/3/person/${a.tmdbId}?api_key=${TMDB_API_KEY}`);
        const data=await res.json();
        name=data.name;
        img=data.profile_path
          ? "https://image.tmdb.org/t/p/w185"+data.profile_path
          : img;
      }catch(e){}
    }

    const div=document.createElement("div");
    div.className="actor-item";

    div.innerHTML=`
      <img src="${img}">
      <div>${name}</div>
    `;

    if(a.tmdbId){
      div.onclick=()=>{
        window.location.href=`actor.html?id=${a.tmdbId}`;
      };
    }

    actorsDiv.appendChild(div);
  }
}

/* IMAGES */
function renderImages(){
  imagesDiv.innerHTML="";

  movie.images.forEach(img=>{
    const i=document.createElement("img");
    i.src=img;

    i.onclick=()=>{
      modalImg.src=img;
      imageModal.style.display="flex";
    };

    imagesDiv.appendChild(i);
  });
}

/* MODAL */
const imageModal=document.createElement("div");
imageModal.id="imageModal";
imageModal.innerHTML=`<img id="modalImg">`;
document.body.appendChild(imageModal);

const modalImg=document.getElementById("modalImg");

imageModal.onclick=()=>{
  imageModal.style.display="none";
};

/* INIT */
function init(){
  if(!movie) return;

  title.textContent=movie.title;
  genre.textContent=movie.genre;
  desc.textContent=movie.desc;

  loadVideo(movie.video[0]);
  renderEpisodes();
  renderActors();
  renderImages();
}

init();
</script>

</body>
</html>
