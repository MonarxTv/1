<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kino</title>

<style>
/* ================= GLOBAL ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

:root{
  --gold:#FFD700;
  --bg:#000;
}

body{
  background:var(--bg);
  color:#fff;
}

/* ================= HEADER ================= */
.header{
  padding:16px;
  font-size:20px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,215,0,0.2);
}

.header::before{
  content:"👑";
}

/* ================= CONTAINER ================= */
.container{
  padding:15px;
}

/* ================= PLAYER ================= */
#playerContainer{
  width:100%;
  height:56vw;
  background:#000;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 0 25px rgba(255,215,0,0.15);
}

#playerContainer iframe,
#playerContainer video{
  width:100%;
  height:100%;
}

/* ================= DOWNLOAD ================= */
#downloadBtn{
  display:block;
  text-align:center;
  padding:12px;
  background:linear-gradient(135deg,#FFD700,#FFC300);
  color:#000;
  border-radius:12px;
  text-decoration:none;
  font-weight:700;
  margin:15px 0;
}

/* ================= EPISODES GRID ================= */
#episodes{
  display:grid;
  grid-template-columns: repeat(5, 1fr);
  gap:10px;
  margin-bottom:15px;
}

#episodes button{
  width:100%;
  padding:10px 0;
  border-radius:10px;
  background:#111;
  color:#fff;
  border:1px solid rgba(255,255,255,0.1);
  cursor:pointer;
  transition:.3s;
}

#episodes button:hover{
  border:1px solid var(--gold);
}

#episodes .active{
  background:var(--gold);
  color:#000;
  box-shadow:0 0 10px rgba(255,215,0,0.5);
}

/* ================= INFO ================= */
#genre{
  color:#aaa;
  margin:8px 0;
}

#desc{
  font-size:14px;
  color:#ddd;
  line-height:1.6;
}

/* ================= ACTORS ================= */
.actor-row{
  display:flex;
  gap:14px;
  overflow-x:auto;
  margin:15px 0;
}

.actor-item{
  text-align:center;
  min-width:80px;
}

.actor-item img{
  width:80px;
  height:80px;
  border-radius:50%;
  object-fit:cover;
}

/* ================= IMAGES ================= */
.images{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.images img{
  width:100%;
  aspect-ratio:2/1;
  object-fit:cover;
  border-radius:14px;
  cursor:pointer;
}

/* ================= MODAL ================= */
#imageModal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
}

#imageModal img{
  max-width:90%;
  max-height:90%;
}

/* ================= MOBILE ================= */
@media (max-width:768px){
  #episodes{
    grid-template-columns: repeat(4, 1fr);
  }
}

@media (max-width:480px){
  #episodes{
    grid-template-columns: repeat(3, 1fr);
  }
}

</style>
</head>

<body>

<div class="header" id="movieTitle">Kino</div>

<div class="container">

<div id="playerContainer"></div>

<a id="downloadBtn" href="#" download>
⬇ Yuklab olish
</a>

<div id="premiumBox" style="display:none"></div>

<div id="episodes"></div>

<h3 id="genre"></h3>
<p id="desc"></p>

<h3>👤 Aktyorlar</h3>
<div id="actors" class="actor-row"></div>

<h3>🖼 Rasmlar</h3>
<div id="images" class="images"></div>

</div>

<script src="data.js"></script>

<script>
const params=new URLSearchParams(window.location.search);
const id=params.get("id");
const movie=moviesData[id];

const player=document.getElementById("playerContainer");
const download=document.getElementById("downloadBtn");
const episodes=document.getElementById("episodes");
const genre=document.getElementById("genre");
const desc=document.getElementById("desc");
const actors=document.getElementById("actors");
const images=document.getElementById("images");

/* VIDEO */
function loadVideo(url){
  player.innerHTML="";

  if(url.endsWith(".mp4")){
    download.style.display="block";
    download.href=url;

    const video=document.createElement("video");
    video.src=url;
    video.controls=true;

    player.appendChild(video);
  }else{
    download.style.display="none";

    const iframe=document.createElement("iframe");
    iframe.src=url;
    iframe.allow="autoplay; fullscreen";

    player.appendChild(iframe);
  }
}

/* EPISODES */
function renderEpisodes(){
  if(!movie.video || movie.video.length<=1){
    episodes.style.display="none";
    return;
  }

  movie.video.forEach((v,i)=>{
    const btn=document.createElement("button");
    btn.textContent=(i+1)+"-qism";

    if(i===0) btn.classList.add("active");

    btn.onclick=()=>{
      document.querySelectorAll("#episodes button")
      .forEach(b=>b.classList.remove("active"));

      btn.classList.add("active");
      loadVideo(v);
    };

    episodes.appendChild(btn);
  });
}

/* ACTORS */
function renderActors(){
  movie.actors.forEach(a=>{
    actors.innerHTML+=`
      <div class="actor-item">
        <img src="${a.img}">
        <div>${a.name}</div>
      </div>
    `;
  });
}

/* IMAGES */
function renderImages(){
  movie.images.forEach(img=>{
    const i=document.createElement("img");
    i.src=img;

    i.onclick=()=>{
      modalImg.src=img;
      modal.style.display="flex";
    };

    images.appendChild(i);
  });
}

/* MODAL */
const modal=document.createElement("div");
modal.id="imageModal";
modal.innerHTML=`<img id="modalImg">`;
document.body.appendChild(modal);

const modalImg=document.getElementById("modalImg");

modal.onclick=()=>modal.style.display="none";

/* INIT */
function init(){
  if(!movie) return;

  genre.textContent=movie.genre;
  desc.textContent=movie.desc;

  loadVideo(movie.video[0]);
  renderEpisodes();
  renderActors();
  renderImages();
}

init();
</script>

</body>
</html>
