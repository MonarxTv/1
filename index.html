<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MonarxTv Kinolar Premyera</title>

  <meta name="description" content="MonarxTv – bepul onlayn kinolar, premyeralar va seriallar platformasi. Eng so‘nggi filmlarni tomosha qiling.">
  <meta name="keywords" content="MonarxTv, online kino, bepul kino, premyera, seriallar">
  <meta name="robots" content="index, follow">

  <link rel="canonical" href="https://MonarxTv.github.io/1/">
  <link rel="icon" type="image/png" href="https://pbs.twimg.com/profile_images/1131583348038623232/IOiNBicp.png">

  <!-- PWA -->
  <link rel="manifest" href="/1/manifest.json">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- INSTALL BUTTON STYLE (agar CSSga qo‘shmasang ham ishlaydi) -->
  <style>
    .install-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      z-index: 99999;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .install-btn.hidden { display: none; }
  </style>
</head>

<body>

<!-- INSTALL BUTTON -->
<button id="installBtn" class="install-btn hidden">
  📲 Ilovani o‘rnatish
</button>

<div id="home">

<header>
  <a href="https://t.me/Monarxtv" class="premium-btn xbet-btn" target="_blank">
    <span>Telegram</span>
    <i class="fas fa-download"></i>
  </a>

  <div class="logo-container">
    <div class="logo">
      <i class="fas fa-crown crown-icon"></i> MonarxTv
    </div>
  </div>

  <span id="searchBtn"><i class="fas fa-search"></i></span>
</header>

<!-- GENRES -->
<div class="row genre" id="genres"></div>

<!-- HERO -->
<div class="hero-slider">
  <div class="hero-track" id="heroTrack"></div>

  <button class="hero-btn prev" id="prevBtn">❮</button>
  <button class="hero-btn next" id="nextBtn">❯</button>

  <div class="dots" id="dots"></div>
</div>

<!-- MOVIES -->
<div class="row row-title">
  <h3>Kinolar</h3>
  <button id="allMoviesBtn" class="premium-btn">Barchasi</button>
</div>
<div class="cards" id="movies"></div>

<!-- SERIES -->
<div class="row row-title">
  <h3>Seriallar</h3>
  <button id="allSeriesBtn" class="premium-btn">Barchasi</button>
</div>
<div class="cards" id="series"></div>

<!-- ANIME -->
<div class="row row-title">
  <h3>Animelar</h3>
  <button id="allAnimeBtn" class="premium-btn">Barchasi</button>
</div>
<div class="cards" id="anime"></div>

</div>

<div id="movie" class="hidden"></div>

<script src="data.js"></script>
<script src="script.js"></script>

<!-- SERVICE WORKER -->
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/1/sw.js")
    .then(() => console.log("PWA active"))
    .catch(err => console.log("SW error:", err));
}
</script>

<!-- INSTALL LOGIC -->
<script>
let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.classList.remove("hidden");
});

installBtn.addEventListener("click", async () => {
  if (!deferredPrompt) return;

  deferredPrompt.prompt();

  const choice = await deferredPrompt.userChoice;

  if (choice.outcome === "accepted") {
    console.log("Installed");
  }

  deferredPrompt = null;
  installBtn.classList.add("hidden");
});
</script>

</body>
</html>
