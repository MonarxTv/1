<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shorts</title>
<style>
body{
  margin:0;
  background:#000;
  font-family:sans-serif;
  color:#fff;
}
h1{
  text-align:center;
  margin:15px 0;
}
.container{
  padding:15px;
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}
/* SHORT CARD */
.short{
  width:calc(50% - 12px);
  background:#111;
  border-radius:12px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
}
.short img{
  width:100%;
  display:block;
}
/* WATCH BUTTON */
.watch-btn{
  position:absolute;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  background:#ef4444;
  color:#fff;
  padding:8px 12px;
  border-radius:8px;
  font-weight:600;
  text-align:center;
  cursor:pointer;
}
</style>
</head>
<body>

<h1>Shorts</h1>
<div class="container" id="shortsContainer"></div>

<script src="data.js"></script>
<script>
const shortsContainer = document.getElementById("shortsContainer");

// xavfsiz tekshiruv
function safe(el){ return el!==null && el!==undefined; }

function renderShorts(){
  if(!safe(shortsContainer)) return;

  shortsContainer.innerHTML="";

  shortsData.forEach(item=>{
    // short videoga mos kino topamiz
    const movie = moviesData.find(m=>m.short === item.video);
    if(!movie) return;

    const div = document.createElement("div");
    div.className = "short";

    const imgSrc = movie.image || item.src;

    div.innerHTML = `
      <img src="${imgSrc}">
      <div class="watch-btn">🎬 Kino ko‘rish</div>
    `;

    // tugma bosilganda list.html sahifasini ochish
    div.querySelector(".watch-btn").onclick = (e)=>{
      e.stopPropagation();
      const index = moviesData.indexOf(movie);
      if(index !== -1){
        window.location.href = `list.html?id=${index}`;
      }
    };

    shortsContainer.appendChild(div);
  });
}

// render qilish
renderShorts();
</script>
</body>
</html>
